<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>AI Cover Letter Generator</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="container">

        <header class="header">
            <h1>AI Cover Letter Generator</h1>
            <p>Create a professional cover letter using AI</p>
        </header>

        <main class="main-content">

            <!-- Input Section -->
            <section class="card form-card">

                <h2>Candidate Details</h2>

                <form id="coverLetterForm">

                    <div class="form-group">
                        <label for="candidateName">Candidate Name</label>
                        <input
                            type="text"
                            id="candidateName"
                            placeholder="Enter your name"
                            required
                        >
                    </div>

                    <div class="form-group">
                        <label for="jobRole">Job Role</label>
                        <input
                            type="text"
                            id="jobRole"
                            placeholder="e.g. Software Developer"
                            required
                        >
                    </div>

                    <div class="form-group">
                        <label for="company">Target Company</label>
                        <input
                            type="text"
                            id="company"
                            placeholder="e.g. TCS"
                            required
                        >
                    </div>

                    <div class="form-group">
                        <label for="skills">Key Skills</label>
                        <textarea
                            id="skills"
                            rows="4"
                            placeholder="e.g. Java, HTML, CSS, JavaScript"
                            required
                        ></textarea>
                    </div>

                    <button type="submit" id="generateBtn">
                        Generate Cover Letter
                    </button>

                </form>

            </section>

            <!-- Output Section -->
            <section class="card output-card">

                <div class="output-header">
                    <h2>Generated Cover Letter</h2>

                    <button
                        type="button"
                        id="copyBtn"
                        class="copy-btn"
                    >
                        Copy to Clipboard
                    </button>
                </div>

                <div id="loading" class="loading hidden">
                    Generating...
                </div>

                <div id="coverLetterOutput" class="cover-letter">
                    <p class="placeholder">
                        Your generated cover letter will appear here.
                    </p>
                </div>

            </section>

        </main>

        <footer>
            <p>AI Cover Letter Generator | Sprint 04</p>
        </footer>

    </div>

    <script src="script.js"></script>

</body>
</html>
